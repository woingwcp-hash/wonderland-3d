<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>數字奇幻樂園 - 幼兒3D認讀數字遊戲</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js r128 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Google Fonts: Fredoka & Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Toy Styles (Root level to match flat GitHub upload) -->
    <link rel="stylesheet" href="./style.css">
</head>
<body class="relative select-none">
<!-- 3D WebGL Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Floating 2D Labels for Spawned 3D Counting Objects -->
    <div id="counting-labels-container" class="pointer-events-none absolute inset-0 z-10 overflow-hidden"></div>

    <!-- Top Navigation & Status Bar -->
    <header class="relative z-20 flex flex-wrap items-center justify-between gap-2 px-3 py-2.5 sm:px-6 sm:py-3 pointer-events-none">
        <!-- Left: Brand & Game Mode Switcher -->
        <div class="flex flex-wrap items-center gap-1.5 sm:gap-2 pointer-events-auto">
            <div class="hidden xl:flex items-center gap-2 bg-white/90 backdrop-blur-md px-3.5 py-2 rounded-2xl border-2 border-sky-200 shadow-sm mr-1">
                <span class="text-2xl">🎡</span>
                <span class="font-black text-sky-800 text-lg tracking-wide">數字奇幻樂園</span>
            </div>

            <!-- Mode 1: 3D Gachapon -->
            <button id="mode-btn-gacha" onclick="switchMode('gacha')" class="btn-toy-sm flex items-center gap-1.5 px-3 py-2 sm:px-4 sm:py-2.5 rounded-2xl font-bold text-sm sm:text-base border-2 border-amber-400 bg-amber-400 text-amber-950">
                <span class="text-lg sm:text-xl">🔮</span>
                <span>扭蛋尋寶</span>
            </button>

            <!-- Mode 2: 3D Number Train -->
            <button id="mode-btn-train" onclick="switchMode('train')" class="btn-toy-sm flex items-center gap-1.5 px-3 py-2 sm:px-4 sm:py-2.5 rounded-2xl font-bold text-sm sm:text-base border-2 border-white/80 bg-white/90 text-slate-700 hover:bg-sky-50">
                <span class="text-lg sm:text-xl">🚂</span>
                <span>數字小火車</span>
            </button>

            <!-- Mode 3: Free Exploration -->
            <button id="mode-btn-explore" onclick="switchMode('explore')" class="btn-toy-sm flex items-center gap-1.5 px-3 py-2 sm:px-4 sm:py-2.5 rounded-2xl font-bold text-sm sm:text-base border-2 border-white/80 bg-white/90 text-slate-700 hover:bg-sky-50">
                <span class="text-lg sm:text-xl">🎨</span>
                <span>自由點讀</span>
            </button>

            <!-- Mode 4: NEW Mario-Style 3D Number Adventure -->
            <button id="mode-btn-mario" onclick="switchMode('mario')" class="btn-toy-sm flex items-center gap-1.5 px-3 py-2 sm:px-4 sm:py-2.5 rounded-2xl font-bold text-sm sm:text-base border-2 border-white/80 bg-white/90 text-slate-700 hover:bg-sky-50">
                <span class="text-lg sm:text-xl">🍄</span>
                <span>數字大冒險</span>
            </button>
        </div>

        <!-- Right: Star Progress, Sound Toggle, Toy Cabinet & Teacher Settings -->
        <div class="flex items-center gap-1.5 sm:gap-2 pointer-events-auto ml-auto">
            <!-- Mario Stage Badge (Shown in Mario Adventure Mode) -->
            <div id="mario-stage-badge" class="hidden items-center gap-1.5 bg-red-500 text-white font-black px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-2xl border-2 border-yellow-300 shadow-sm text-xs sm:text-sm">
                <span>🏰 關卡</span>
                <span id="mario-stage-text" class="bg-white text-red-600 px-2 py-0.5 rounded-lg font-black">1-1</span>
            </div>

            <!-- 5-Star Progress Bar -->
            <div class="flex items-center gap-1 bg-white/90 backdrop-blur-md px-2.5 py-1.5 sm:px-3.5 sm:py-2 rounded-2xl border-2 border-yellow-300 shadow-sm" title="集齊5粒星可抽3D玩具獎印！">
                <div id="stars-bar" class="flex items-center gap-1 text-base sm:text-xl"><i class="fa-solid fa-star text-slate-200"></i><i class="fa-solid fa-star text-slate-200"></i><i class="fa-solid fa-star text-slate-200"></i><i class="fa-solid fa-star text-slate-200"></i><i class="fa-solid fa-star text-slate-200"></i></div>
            </div>

            <!-- Sound Effects Mute/Unmute Toggle (No TTS Voice) -->
            <button id="btn-sfx-toggle" onclick="toggleSfx()" class="btn-toy-sm flex items-center gap-1 bg-sky-500 hover:bg-sky-400 text-white font-bold px-2.5 py-2 sm:px-3.5 sm:py-2.5 rounded-2xl border-2 border-sky-300 text-xs sm:text-sm" title="開關遊戲音樂特效（已關閉語音朗讀）">
                <i id="sfx-icon" class="fa-solid fa-music text-sm sm:text-base"></i>
                <span id="sfx-label" class="hidden md:inline">音效：開</span>
            </button>

            <!-- My Toy Box Button -->
            <button onclick="toggleToyModal(true)" class="btn-toy-sm flex items-center gap-1.5 bg-pink-500 hover:bg-pink-400 text-white font-bold px-3 py-2 sm:px-4 sm:py-2.5 rounded-2xl border-2 border-pink-300 text-sm sm:text-base">
                <span class="text-base sm:text-lg">🏆</span>
                <span class="hidden md:inline">玩具櫃</span>
                <span id="toy-count-badge" class="bg-white text-pink-600 px-2 py-0.5 rounded-full text-xs font-black">1</span>
            </button>

            <!-- Visual Prompt Trigger Button (Teacher Assist) -->
            <button id="btn-visual-hint" onclick="triggerVisualHint(true)" class="btn-toy-sm flex items-center gap-1.5 bg-emerald-500 hover:bg-emerald-400 text-white font-bold px-3 py-2 sm:px-3.5 sm:py-2.5 rounded-2xl border-2 border-emerald-300 text-sm sm:text-base" title="立即放大發光提示正確數字" style="display: flex;">
                <span class="text-base sm:text-lg">💡</span>
                <span class="hidden sm:inline">提示</span>
            </button>

            <!-- Teacher / Parent Settings Button -->
            <button onclick="toggleSettingsModal(true)" class="btn-toy-sm flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-3 py-2 sm:px-3.5 sm:py-2.5 rounded-2xl border-2 border-indigo-400 text-sm sm:text-base" title="教學調適設定">
                <i class="fa-solid fa-sliders text-base sm:text-lg"></i>
                <span class="hidden lg:inline">教學設定</span>
            </button>

            <!-- GitHub Modular File Exporter Button -->
            
        </div>
    </header>

    <!-- Bottom / Center Mission Banner & Arcade Controls -->
    <div class="pointer-events-none absolute inset-x-0 bottom-3 sm:bottom-5 z-20 flex flex-col items-center justify-end px-3 sm:px-4 gap-2.5">
        
        <!-- Big Quantity Counting Counter Pill (Shows when counting 1..N objects/coins) -->
        <div id="counting-banner" class="hidden pointer-events-auto transform transition-all duration-300 bg-gradient-to-r from-amber-400 via-orange-400 to-pink-500 p-1 rounded-3xl shadow-xl">
            <div class="bg-white/95 backdrop-blur px-5 py-2 rounded-[20px] flex items-center gap-3.5">
                <span id="counting-emoji" class="text-3xl sm:text-4xl animate-bounce">🍎</span>
                <div class="flex flex-col">
                    <span class="text-xs font-bold text-slate-400 tracking-wider">一齊數數看（數與量結合）</span>
                    <div id="counting-dots" class="flex items-center gap-1.5 mt-0.5 text-xl sm:text-2xl font-black text-orange-500">
                        <!-- Dynamically filled: 1, 2, 3... -->
                    </div>
                </div>
            </div>
        </div>

        <!-- NEW: Mario Adventure Arcade Controller Bar (Only visible in Mario Mode) -->
        <div id="mario-controls-bar" class="hidden pointer-events-auto items-center justify-center gap-2.5 sm:gap-4 bg-slate-900/80 backdrop-blur-md px-4 py-2.5 sm:px-6 sm:py-3 rounded-3xl border-2 border-amber-400 shadow-2xl">
            <button onclick="marioMoveStep(-1)" class="btn-toy bg-sky-500 hover:bg-sky-400 active:bg-sky-600 text-white font-black px-4 py-2.5 sm:px-6 sm:py-3 rounded-2xl border-2 border-sky-200 flex items-center gap-1.5 text-base sm:text-xl">
                <i class="fa-solid fa-caret-left text-xl sm:text-2xl"></i>
                <span>向左行</span>
            </button>

            <button onclick="marioJumpAction()" class="btn-toy bg-gradient-to-b from-red-500 to-red-600 hover:from-red-400 hover:to-red-500 text-white font-black px-5 py-3 sm:px-8 sm:py-3.5 rounded-2xl border-2 border-yellow-300 flex items-center gap-2 text-base sm:text-xl animate-pulse-soft">
                <span class="text-xl sm:text-2xl">🍄</span>
                <span>跳起頂磚塊！</span>
            </button>

            <button onclick="marioMoveStep(1)" class="btn-toy bg-sky-500 hover:bg-sky-400 active:bg-sky-600 text-white font-black px-4 py-2.5 sm:px-6 sm:py-3 rounded-2xl border-2 border-sky-200 flex items-center gap-1.5 text-base sm:text-xl">
                <span>向右行</span>
                <i class="fa-solid fa-caret-right text-xl sm:text-2xl"></i>
            </button>
        </div>

        <!-- Main Visual Mission Bar (Replaced TTS speaker with Big Target Numeral Card) -->
        <div class="pointer-events-auto flex items-center gap-2.5 sm:gap-3.5 bg-white/95 backdrop-blur-md px-3.5 py-2.5 sm:px-5 sm:py-3 rounded-3xl border-4 border-sky-300 shadow-2xl max-w-2xl w-full justify-between">
            <!-- Big Visual Target Numeral Badge (Clear non-verbal cue for toddlers) -->
            <button onclick="triggerVisualHint(true)" id="target-number-card" class="btn-toy flex-shrink-0 min-w-[60px] h-14 sm:min-w-[72px] sm:h-16 px-2.5 rounded-2xl bg-gradient-to-b from-amber-300 to-amber-400 text-slate-900 flex flex-col items-center justify-center border-2 border-amber-500 animate-pulse-soft" title="目標數字提示卡">
                <span id="target-badge-num" class="text-2xl sm:text-3xl font-black leading-none" style="font-family: 'Fredoka', sans-serif;">3</span>
                <span id="target-badge-dots" class="text-[10px] sm:text-xs font-black text-amber-900 tracking-tighter mt-0.5">●●●</span>
            </button>

            <!-- Instruction Text -->
            <div class="flex-1 text-center px-1">
                <p id="prompt-text" class="text-base sm:text-xl md:text-2xl font-black text-slate-800 tracking-wide leading-snug">請搵出數字「3」（三）扭蛋尋寶！</p>
                <p id="sub-prompt-text" class="text-xs sm:text-sm font-bold text-sky-600 mt-0.5">可對照左方目標卡，輕觸畫面中的立體數字「3」</p>
            </div>

            <!-- Next Question / Range Toggle in Explore Mode -->
            <button id="next-or-range-btn" onclick="handleRightActionBtn()" class="btn-toy flex-shrink-0 px-3 py-2.5 sm:px-4 sm:py-3 rounded-2xl bg-amber-400 hover:bg-amber-300 text-amber-950 font-black text-xs sm:text-base border-2 border-amber-200 flex items-center gap-1.5">
                <span id="right-btn-label">下一關</span>
                <i id="right-btn-icon" class="fa-solid fa-forward-step"></i>
            </button>
        </div>
    </div>

    <!-- ==================== MODAL 1: TEACHER / PARENT SETTINGS (教學調適設定) ==================== -->
    <div id="settings-modal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-7 border-4 border-indigo-200 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between border-b-2 border-slate-100 pb-4 mb-5">
                <div class="flex items-center gap-3">
                    <div class="w-11 h-11 rounded-2xl bg-indigo-100 text-indigo-600 flex items-center justify-center text-xl font-bold">
                        <i class="fa-solid fa-sliders"></i>
                    </div>
                    <div>
                        <h2 class="text-xl sm:text-2xl font-black text-slate-800">教師／家長教學調適設定</h2>
                        <p class="text-xs sm:text-sm text-slate-500 font-medium">按幼兒學習階段及專注需要靈活調整</p>
                    </div>
                </div>
                <button onclick="toggleSettingsModal(false)" class="w-10 h-10 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="space-y-5">
                <!-- Setting 1: Number Range -->
                <div>
                    <label class="block text-sm font-black text-slate-700 mb-2">
                        🔢 1. 認讀數字範圍（教學階梯）
                    </label>
                    <div class="grid grid-cols-3 gap-2.5">
                        <button onclick="updateSetting('range', '1-5')" id="set-range-1-5" class="setting-pill py-3 px-3 rounded-2xl font-bold text-sm sm:text-base border-2 transition-all">
                            1 - 5<br><span class="text-xs font-normal opacity-80">初階 (K1)</span>
                        </button>
                        <button onclick="updateSetting('range', '6-10')" id="set-range-6-10" class="setting-pill py-3 px-3 rounded-2xl font-bold text-sm sm:text-base border-2 transition-all">
                            6 - 10<br><span class="text-xs font-normal opacity-80">進階 (K2)</span>
                        </button>
                        <button onclick="updateSetting('range', '1-10')" id="set-range-1-10" class="setting-pill py-3 px-3 rounded-2xl font-bold text-sm sm:text-base border-2 transition-all">
                            1 - 10<br><span class="text-xs font-normal opacity-80">綜合挑戰</span>
                        </button>
                    </div>
                </div>

                <!-- Setting 2: Option Count (Errorless to Standard) -->
                <div>
                    <label class="block text-sm font-black text-slate-700 mb-2">
                        🎯 2. 選項數量（難度與無錯誤學習調適）
                    </label>
                    <div class="grid grid-cols-3 gap-2.5">
                        <button onclick="updateSetting('choices', 1)" id="set-choices-1" class="setting-pill py-3 px-2 rounded-2xl font-bold text-sm sm:text-base border-2 transition-all">
                            1 選 1<br><span class="text-xs font-normal opacity-80">無錯誤學習</span>
                        </button>
                        <button onclick="updateSetting('choices', 2)" id="set-choices-2" class="setting-pill py-3 px-2 rounded-2xl font-bold text-sm sm:text-base border-2 transition-all">
                            2 選 1<br><span class="text-xs font-normal opacity-80">基礎辨別</span>
                        </button>
                        <button onclick="updateSetting('choices', 3)" id="set-choices-3" class="setting-pill py-3 px-2 rounded-2xl font-bold text-sm sm:text-base border-2 transition-all">
                            3 選 1<br><span class="text-xs font-normal opacity-80">標準挑戰</span>
                        </button>
                    </div>
                </div>

                <!-- Setting 3: Background Distraction Level -->
                <div>
                    <label class="block text-sm font-black text-slate-700 mb-2">
                        🌿 3. 3D 場景背景（視覺干擾控制）
                    </label>
                    <div class="grid grid-cols-2 gap-2.5">
                        <button onclick="updateSetting('lowDistraction', false)" id="set-bg-rich" class="setting-pill py-3 px-3 rounded-2xl font-bold text-sm border-2 transition-all flex items-center justify-center gap-2">
                            <span>🌈</span>
                            <span>豐富 3D 樂園背景</span>
                        </button>
                        <button onclick="updateSetting('lowDistraction', true)" id="set-bg-calm" class="setting-pill py-3 px-3 rounded-2xl font-bold text-sm border-2 transition-all flex items-center justify-center gap-2">
                            <span>🌿</span>
                            <span>低干擾純色背景</span>
                        </button>
                    </div>
                </div>

                <!-- Setting 4: Auto Visual Prompt & Quantity Counting -->
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-3">
                    <div class="flex items-center justify-between">
                        <div>
                            <div class="font-bold text-slate-800 text-sm sm:text-base">💡 6秒自動視覺提示</div>
                            <div class="text-xs text-slate-500">若幼兒停頓未按，正確 3D 數字會自動發光彈跳</div>
                        </div>
                        <button id="toggle-autoprompt" onclick="updateSetting('autoPrompt', !gameState.settings.autoPrompt)" class="w-14 h-8 rounded-full transition-colors p-1 flex items-center bg-emerald-500">
                            <div class="w-6 h-6 rounded-full bg-white shadow transform transition-transform translate-x-6"></div>
                        </button>
                    </div>

                    <div class="border-t border-slate-200 pt-3 flex items-center justify-between">
                        <div>
                            <div class="font-bold text-slate-800 text-sm sm:text-base">🍎 答啱後「數與量」立體點數</div>
                            <div class="text-xs text-slate-500">逐一彈出對應數量的 3D 蘋果或金幣並配樂音階</div>
                        </div>
                        <button id="toggle-counting" onclick="updateSetting('countObjects', !gameState.settings.countObjects)" class="w-14 h-8 rounded-full transition-colors p-1 flex items-center bg-emerald-500">
                            <div class="w-6 h-6 rounded-full bg-white shadow transform transition-transform translate-x-6"></div>
                        </button>
                    </div>
                </div>
            </div>

            <div class="mt-6 flex justify-end">
                <button onclick="toggleSettingsModal(false)" class="btn-toy w-full py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-black text-lg">
                    完成並返回遊戲
                </button>
            </div>
        </div>
    </div>

    <!-- ==================== MODAL 2: TOY COLLECTION CABINET (我的3D玩具櫃) ==================== -->
    <div id="toy-modal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-xl w-full p-6 sm:p-7 border-4 border-pink-300 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between border-b-2 border-pink-100 pb-4 mb-4">
                <div class="flex items-center gap-3">
                    <span class="text-3xl">🏆</span>
                    <div>
                        <h2 class="text-xl sm:text-2xl font-black text-slate-800">我的數字玩具寶盒</h2>
                        <p class="text-xs sm:text-sm text-slate-500 font-medium">每集齊 5 粒星星就可以解鎖一個新玩具！撳下佢哋會講嘢㗎！</p>
                    </div>
                </div>
                <button onclick="toggleToyModal(false)" class="w-10 h-10 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Celebration Banner when newly unlocked -->
            <div id="new-reward-banner" class="hidden mb-4 bg-gradient-to-r from-yellow-100 via-amber-100 to-orange-100 border-2 border-amber-300 rounded-2xl p-4 text-center">
                <div class="text-sm font-black text-amber-700">🎉 恭喜你集齊 5 粒星星！解鎖咗新玩具：</div>
                <div id="new-reward-name" class="text-2xl font-black text-orange-600 mt-1">🦖 1號小恐龍</div>
            </div>

            <!-- Grid of 10 Number Toys -->
            <div id="toy-grid" class="grid grid-cols-2 sm:grid-cols-5 gap-3">
                <!-- Populated by JS -->
            </div>

            <div class="mt-6">
                <button onclick="toggleToyModal(false)" class="btn-toy w-full py-3.5 rounded-2xl bg-pink-500 hover:bg-pink-400 text-white font-black text-lg">
                    繼續玩遊戲！
                </button>
            </div>
        </div>
    </div>

    <!-- ==================== MODAL 3: GITHUB MULTI-FILE EXPORTER (GitHub 專案分拆與匯出中心) ==================== -->

    <!-- Modular Game Scripts (Root level to match flat GitHub upload) -->
    <script src="./config.js"></script>
    <script src="./audio.js"></script>
    <script src="./scene3d.js"></script>
    <script src="./main.js"></script>
</body>
</html>
